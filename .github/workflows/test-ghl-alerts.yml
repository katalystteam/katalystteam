name: Test GHL alerts
on:
  push:
    paths: ['ghl-alerts/**', '.github/workflows/test-ghl-alerts.yml']
  pull_request:
    paths: ['ghl-alerts/**', '.github/workflows/test-ghl-alerts.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ghl-alerts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ghl-alerts/package-lock.json
      - run: npm ci
      - run: npm test
