name: GHL activity alerts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'poll sends new activity; dry-run checks access without changes; test-slack sends one labeled test'
        type: choice
        options: [poll, dry-run, test-slack]
        default: poll

concurrency:
  group: ghl-activity-alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    # Enable the schedule only after the credentials and dry-run are verified.
    if: github.event_name == 'workflow_dispatch' || vars.GHL_ALERTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Poll GHL and send Slack alerts
        env:
          GHL_API_TOKEN: ${{ secrets.GHL_SECRET_KEY }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ALERT_STATE_KEY: ${{ secrets.ALERT_STATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_MODE: ${{ inputs.mode || 'poll' }}
        run: node ghl-alerts/poll.mjs
